<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaustech - Apple Style</title>
    <style>
        /* --- 1. 全局样式 --- */
        body, html { margin: 0; padding: 0; font-family: "SF Pro SC","SF Pro Text","SF Pro Icons","PingFang SC", sans-serif; background-color: #fff; color: #1d1d1f; }
        
        /* --- 2. 经典黑色导航栏 --- */
        nav { position: fixed; top: 0; width: 100%; height: 44px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); z-index: 9999; display: flex; justify-content: center; }
        .nav-content { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .nav-content a { color: #f5f5f7; text-decoration: none; font-size: 12px; opacity: 0.8; transition: 0.3s; }
        .nav-content a:hover { opacity: 1; }
        .nav-logo { font-weight: bold; font-size: 16px !important; }

        /* --- 3. 产品展示区 (Hero Section) --- */
        .section { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 80px; text-align: center; overflow: hidden; background-color: #fbfbfd; }
        
        /* 黑色主题产品区 */
        .section-dark { background-color: #000; color: #f5f5f7; }

        .title { font-size: 56px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 0; }
        .subtitle { font-size: 28px; font-weight: 400; margin-top: 5px; }
        .links { margin-top: 15px; }
        .links a { color: #0066cc; text-decoration: none; font-size: 21px; margin: 0 15px; }
        .links a:hover { text-decoration: underline; }

        /* --- 4. 模拟大图 --- */
        .product-img { width: 80%; max-width: 800px; margin-top: 40px; border-radius: 20px; transition: 0.8s; }
        .product-img:hover { transform: scale(1.02); }

    </style>
</head>
<body>

    <nav>
        <div class="nav-content">
            <a href="#" class="nav-logo">Kaustech</a>
            <a href="#">技术</a>
            <a href="#">翻译</a>
            <a href="#">汽车租赁</a>
            <a href="#">支持</a>
            <a href="#">🔍</a>
        </div>
    </nav>

    <div class="section">
        <h1 class="title">Kaustech Pro</h1>
        <p class="subtitle">强劲动力，不止于此。</p>
        <div class="links">
            <a href="#">进一步了解 ></a>
            <a href="#">立即购买 ></a>
        </div>
        <img src="https://www.apple.com.cn/v/home/bl/images/heroes/iphone-15-pro/hero_iphone15pro__be951ih9ot6u_largetall.jpg" class="product-img" alt="Product">
    </div>

    <div class="section section-dark">
        <h1 class="title">全球视野</h1>
        <p class="subtitle">韩语翻译与技术创新的完美结合。</p>
        <div class="links">
            <a href="#">了解翻译服务 ></a>
        </div>
        <img src="https://images.unsplash.com/photo-1517336712461-77b803aa2742?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80" class="product-img" alt="Tech">
    </div>

</body>
</html>
