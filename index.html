<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaustech | 个人主页</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { text-align: center; padding: 40px; border: 1px solid #1e293b; border-radius: 20px; background: #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; font-size: 1.1rem; }
        .links { margin-top: 20px; }
        .btn { display: inline-block; padding: 10px 20px; margin: 5px; border-radius: 8px; background: #38bdf8; color: #0f172a; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>KAUSTECH</h1>
        <p>探索技术 · 创造价值 · 链接未来</p>
        <div class="links">
            <a href="#" class="btn">关于我</a>
            <a href="mailto:your-email@example.com" class="btn">联系合作</a>
        </div>
    </div>
</body>
</html>
